[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findoc"
version = "0.1.0"
description = "YOLO26 field detection + Tesseract OCR as a partition-level, GPU-schedulable Spark pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Anonymous Authors" }]
dependencies = [
  "ultralytics>=8.4",
  "pyspark>=4.0,<4.1",
  "pyarrow>=15",
  "pandas>=2.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "pytesseract>=0.3.10",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxslim>=0.1.71",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# RAPIDS cuDF is installed from NVIDIA's index, not PyPI proper; see docs/REQUIREMENTS.md
gpu = ["cudf-cu12>=25.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs Spark + a real YOLO model (slower)"]
